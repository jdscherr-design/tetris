<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0d0f1a">
  <meta name="description" content="Tetris in your browser, with hold, ghost piece and touch controls.">
  <title>Tetris</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 20'><path fill='%23b061ff' d='M10 0h10v10h10v10H0V10h10z'/></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game">
    <aside class="side">
      <section class="panel">
        <h2>Hold</h2>
        <canvas id="hold" width="160" height="120" role="img" aria-label="Held piece"></canvas>
      </section>
      <section class="panel stats" aria-live="off">
        <div><h2>Score</h2><output id="score">0</output></div>
        <div><h2>Best</h2><output id="best">0</output></div>
        <div><h2>Level</h2><output id="level">1</output></div>
        <div><h2>Lines</h2><output id="lines">0</output></div>
      </section>
    </aside>

    <div class="well">
      <canvas id="board" width="600" height="1200" role="img" aria-label="Tetris board"></canvas>
      <div id="overlay" class="overlay">
        <h1 id="overlay-title">Tetris</h1>
        <p id="overlay-text"></p>
        <button id="overlay-button" type="button">Play</button>
      </div>
    </div>

    <aside class="side">
      <section class="panel">
        <h2>Next</h2>
        <canvas id="next" width="160" height="480" role="img" aria-label="Upcoming pieces"></canvas>
      </section>
      <button id="pause" class="pause" type="button">Pause</button>
    </aside>
  </main>

  <dl class="keys">
    <div><dt>← →</dt><dd>Move</dd></div>
    <div><dt>↓</dt><dd>Soft drop</dd></div>
    <div><dt>Space</dt><dd>Hard drop</dd></div>
    <div><dt>↑ / X</dt><dd>Rotate right</dd></div>
    <div><dt>Z</dt><dd>Rotate left</dd></div>
    <div><dt>C / Shift</dt><dd>Hold</dd></div>
    <div><dt>P / Esc</dt><dd>Pause</dd></div>
  </dl>

  <div class="touch" aria-label="Touch controls">
    <button type="button" data-action="hold">Hold</button>
    <button type="button" data-action="ccw" aria-label="Rotate left">⟲</button>
    <button type="button" data-action="cw" aria-label="Rotate right">⟳</button>
    <button type="button" data-action="hard">Drop</button>
    <button type="button" data-action="left" aria-label="Move left">←</button>
    <button type="button" data-action="down" aria-label="Soft drop">↓</button>
    <button type="button" data-action="right" aria-label="Move right">→</button>
  </div>

  <script src="game.js"></script>
</body>
</html>
